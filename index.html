<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lest We Forget — Shared Gratitude Vault</title>
    <meta name="description" content="A minimalist offline-first gratitude vault displaying shared moments on white and brown kraft tags." />
    <meta property="og:title" content="Lest We Forget" />
    <meta property="og:description" content="A minimalist offline-first gratitude vault displaying shared moments on white and brown kraft tags." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F5EFE4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16120F" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LestWeForget" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kept_tags_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5EFE4] text-[#241D17] dark:bg-[#16120F] dark:text-[#EFE6D8] antialiased selection:bg-[#A65E22]/20 dark:selection:bg-[#D48C46]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
